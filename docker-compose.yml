# EMS Food — production stack for a single Linux VPS.
#
#   cp .env.example .env    # then fill in real secrets
#   docker compose up -d --build
#   docker compose exec api python -m app.cli create-admin
#
# Caddy obtains and renews HTTPS certificates automatically for API_DOMAIN.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ems_food}
      POSTGRES_USER: ${POSTGRES_USER:-ems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ems} -d ${POSTGRES_DB:-ems_food}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["api"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ems}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ems_food}
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ems}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ems_food}
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/mobile/dist:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
