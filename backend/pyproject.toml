[project]
name = "ems-food-backend"
version = "1.0.0"
description = "EMS Food — internal daily food-ordering API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI Depends() in defaults is idiomatic
  "S101",    # asserts are used in tests
  "RUF001",  # Arabic characters in strings are intentional
  "RUF002",
  "RUF003",
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"app/cli.py" = ["S311"]
"app/models/enums.py" = ["S105"]   # enum names, not secrets
"app/schemas/auth.py" = ["S105"]   # token_type = "bearer"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "ocr: requires the Tesseract OCR binary (run inside the Docker image)",
]
filterwarnings = [
  "ignore::DeprecationWarning:slowapi.*",
]
